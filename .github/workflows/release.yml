name: Release

# On a v* tag: build binaries and wheels, create the GitHub release, and publish. npm and
# PyPI use trusted publishing, so each package must list this repo and release.yml as a
# trusted publisher. On npm, each of the five packages must allow direct `npm publish`,
# not only staged publishing; otherwise the job can fail after publishing some packages,
# and a rerun hits versions that already exist. crates.io publishes when the
# CARGO_REGISTRY_TOKEN secret is set. Then check `npx @greerviau/titer` and `uvx titer`
# on Linux x64 and macOS arm64.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  version:
    # The tag must name the version in Cargo.toml, which every registry publishes.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tokens:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.check.outputs.crates }}
    steps:
      - id: check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "crates=${CARGO_REGISTRY_TOKEN:+true}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, npm: linux-x64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, npm: linux-arm64 }
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, npm: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/titer out/titer-${{ matrix.npm }}
          tar -czf out/titer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release titer
          ./target/${{ matrix.target }}/release/titer --version || true
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.npm }}
          path: out/

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist/

  github:
    needs: [binaries, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.whl > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes *.tar.gz *.whl SHA256SUMS

  npm:
    needs: [version, binaries, github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No registry-url: npm already defaults to npmjs.org, and that option only writes a
      # token .npmrc, which trusted publishing does not use.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      - name: Publish
        run: |
          scripts/npm-packages.py "${{ needs.version.outputs.version }}" bins npm-out
          # A ./ prefix keeps npm from reading owner/name paths as GitHub specs.
          for pkg in ./npm-out/titer-*; do npm publish --access public "$pkg"; done
          npm publish --access public ./npm-out/titer

  pypi:
    needs: [wheels, sdist, github]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: uv publish --trusted-publishing always dist/*

  crates:
    needs: [tokens, github]
    if: needs.tokens.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  verify-npm:
    needs: [version, npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npx runs the published version
        # npm took about 5 minutes to serve new packages on 0.1.1, so retry for 10. Each
        # attempt gets a fresh cache: npx keeps an install that skipped a platform package
        # npm was not serving yet, and would rerun it on every retry.
        run: |
          version="${{ needs.version.outputs.version }}"
          for attempt in $(seq 21); do
            if [ "$attempt" -gt 1 ]; then sleep 30; fi
            cache="$RUNNER_TEMP/npm-cache-$attempt"
            if npm_config_cache="$cache" npx -y "@greerviau/titer@$version" --version | grep -qx "titer $version"; then exit 0; fi
          done
          exit 1

  verify-pypi:
    needs: [version, pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@v7
      - name: uvx runs the published version
        run: |
          version="${{ needs.version.outputs.version }}"
          for attempt in $(seq 21); do
            if [ "$attempt" -gt 1 ]; then sleep 30; fi
            if uvx --no-cache "titer@$version" --version | grep -qx "titer $version"; then exit 0; fi
          done
          exit 1
