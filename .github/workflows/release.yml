name: Release

# On a v* tag: build binaries and wheels, create the GitHub release, and publish to npm,
# PyPI, and crates.io for each registry whose token is set as a repo secret (NPM_TOKEN,
# PYPI_TOKEN, CARGO_REGISTRY_TOKEN). Then check `npx titer` and `uvx titer` on Linux x64
# and macOS arm64.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.check.outputs.npm }}
      pypi: ${{ steps.check.outputs.pypi }}
      crates: ${{ steps.check.outputs.crates }}
    steps:
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "npm=${NPM_TOKEN:+true}" >> "$GITHUB_OUTPUT"
          echo "pypi=${PYPI_TOKEN:+true}" >> "$GITHUB_OUTPUT"
          echo "crates=${CARGO_REGISTRY_TOKEN:+true}" >> "$GITHUB_OUTPUT"

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, npm: linux-x64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, npm: linux-arm64 }
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, npm: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/titer out/titer-${{ matrix.npm }}
          tar -czf out/titer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release titer
          ./target/${{ matrix.target }}/release/titer --version || true
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.npm }}
          path: out/

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist/

  github:
    needs: [binaries, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.whl > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes *.tar.gz *.whl SHA256SUMS

  npm:
    needs: [tokens, binaries, github]
    if: needs.tokens.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/npm-packages.py "$version" bins npm-out
          for pkg in npm-out/titer-*; do npm publish --access public "$pkg"; done
          npm publish --access public npm-out/titer

  pypi:
    needs: [tokens, wheels, sdist, github]
    if: needs.tokens.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: uv publish --token "${{ secrets.PYPI_TOKEN }}" dist/*

  crates:
    needs: [tokens, github]
    if: needs.tokens.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  verify:
    needs: [npm, pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
      - name: npx and uvx run the published version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if npx -y "titer@$version" --version && uvx --no-cache "titer@$version" --version; then exit 0; fi
            sleep 30
          done
          exit 1
