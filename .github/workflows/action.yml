name: Action self-test

# Runs this repo's GitHub Action (uses: ./) on fixture repos built from this branch's
# titer: a proven change must pass and an unproven change must fail.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: cargo build --release --locked
      - name: Fixtures
        run: |
          uv venv --quiet "$RUNNER_TEMP/venv"
          uv pip install --quiet --python "$RUNNER_TEMP/venv/bin/python" pytest==9.2.0
          for mode in proven unproven; do
            scripts/action-fixture.sh "$RUNNER_TEMP/$mode" "$PWD/target/release/titer" "$mode" "$RUNNER_TEMP/venv/bin/python"
          done
      - name: A proven change passes
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/proven
          base: main
          command: ${{ github.workspace }}/target/release/titer
      - name: An unproven change fails
        id: unproven
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/unproven
          base: main
          command: ${{ github.workspace }}/target/release/titer
      - name: The unproven run failed with exit 1
        env:
          OUTCOME: ${{ steps.unproven.outcome }}
          CODE: ${{ steps.unproven.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure && test "$CODE" = 1
