[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "titer"
description = "Check whether a change's tests test the change: fail-on-base, diff-scoped mutation, weakened-test scan, and CRAP."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.8"
keywords = ["testing", "mutation-testing", "ci", "agents", "pytest", "vitest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/greerviau/titer"

[tool.maturin]
bindings = "bin"
strip = true
