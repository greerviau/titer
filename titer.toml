# titer checks its own changes. See docs/configuration.md for every option.

[[runner]]
kind = "cargo"
command = ["cargo", "test", "--locked"]
# The fixture tests run pytest and vitest from here; scripts/setup-fixture-deps.sh
# installs them.
deps = [".fixture-deps"]

[gate]
