[package]
name = "titer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prove that a change's tests test the change: fail-on-base, diff-scoped mutation, weakened-test scan, and CRAP."
license = "MIT OR Apache-2.0"
repository = "https://github.com/greerviau/titer"
readme = "README.md"
keywords = ["testing", "mutation-testing", "ci", "agents"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = [".github/", "scripts/", ".fixture-deps/"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
humantime = "2.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
