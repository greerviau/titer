[package]
name = "titer"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Check whether a change's tests test the change: fail-on-base, diff-scoped mutation, weakened-test scan, and CRAP."
license = "MIT OR Apache-2.0"
repository = "https://github.com/greerviau/titer"
readme = "README.md"
keywords = ["testing", "mutation-testing", "ci", "agents"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = [".github/", "scripts/", ".fixture-deps/", "npm/", "replay/", "pyproject.toml"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
humantime = "2.4"
libc = "0.2"
regex = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"
thiserror = "2"
toml = "1.2"
toml_edit = "0.25"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
